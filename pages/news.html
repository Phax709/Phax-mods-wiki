<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="page-depth" content="1">
  <title>News — Phax709 Studios</title>
  <link rel="icon" href="images/ui/Phax-mods-petit.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <a href="../index.html" class="header-logo"><img src="images/ui/Phax mods detail.png" alt="Logo" class="header-logo-img"> Phax709 Studios</a>
    <div class="header-search">
      <input type="text" id="searchInput" placeholder="Rechercher un mod..." data-i18n-placeholder="search.placeholder" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="lang-btn" id="langToggle">🇬🇧 EN</button>
    <div class="theme-selector">
      <button class="theme-btn" id="themeBtn" title="Thème">🌙</button>
      <div class="theme-dropdown" id="themeDropdown"></div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2 data-i18n="nav.navigation">Navigation</h2></div>
    <ul class="sidebar-nav">
      <li><a href="../index.html">🏠 <span data-i18n="nav.home">Accueil</span></a></li>
      <li><a href="news.html" class="active">📰 <span data-i18n="nav.news">News</span></a></li>
      <li><a href="patchnotes.html">📋 <span data-i18n="nav.patchnotes">Patchnotes</span></a></li>
      <li>
        <button class="sidebar-toggle">📖 <span data-i18n="nav.guide">Assistance</span></button>
        <ul class="sidebar-sub">
          <li><a href="guide/installation.html" data-i18n="nav.installation">Installation de mods</a></li>
          <li><a href="guide/contribuer.html" data-i18n="nav.support">Discord & Contact</a></li>
        </ul>
      </li>
      <li><a href="credits.html">📜 <span data-i18n="nav.credits">Crédits</span></a></li>
      <li class="sidebar-divider"><hr></li>
      <li class="sidebar-section-title" data-i18n="nav.mods">Mods</li>
    </ul>
  </nav>

  <div class="overlay" id="overlay"></div>

  <main class="content">
    <h1 data-i18n="news.title">📰 News</h1>
    <div class="news-filters">
      <select id="newsFilterBadge" class="patch-filter">
        <option value="all" data-i18n="news.filter_all_types">Tous les types</option>
        <option value="announcement" data-i18n="news.filter_announcement">📢 Annonce</option>
        <option value="update" data-i18n="news.filter_update">🔄 Mise à jour</option>
        <option value="maintenance" data-i18n="news.filter_maintenance">🔧 Maintenance</option>
        <option value="urgent" data-i18n="news.filter_urgent">⚠️ Urgent</option>
        <option value="event" data-i18n="news.filter_event">🎉 Événement</option>
        <option value="info" data-i18n="news.filter_info">ℹ️ Info</option>
      </select>
      <select id="newsSortOrder" class="patch-filter">
        <option value="desc" data-i18n="news.sort_newest">Plus récentes d'abord</option>
        <option value="asc" data-i18n="news.sort_oldest">Plus anciennes d'abord</option>
      </select>
    </div>
    <hr class="section-divider">
    <div id="newsContainer"></div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle"></h2>
      <span class="modal-date" id="modalDate"></span>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="../js/mods-registry.js"></script>
  <script src="../js/news-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
